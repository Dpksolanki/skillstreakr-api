services:
  postgres:
    image: postgres:17-alpine
    container_name: skillstreakr-postgres
    environment:
      POSTGRES_USER: skill
      POSTGRES_PASSWORD: skill
      POSTGRES_DB: skillstreakr
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: skillstreakr-redis
    ports:
      - "6380:6379"

volumes:
  pgdata:
